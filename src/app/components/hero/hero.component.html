<section class="hero" id="sobre">
  <div class="hero-container">
    
    <!-- Badge de Status -->
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>{{ status() }}</span>
    </div>

    <!-- Avatar Tecnológico com Iniciais JE -->
    <div class="avatar-wrapper">
      <div class="avatar-glow"></div>
      <div class="avatar-box">
        <span class="avatar-initials">JE</span>
      </div>
    </div>

    <!-- Informações Principais -->
    <div class="hero-content">
      <p class="greeting">Olá, meu nome é</p>
      <h1 class="name">{{ name() }}</h1>
      <h2 class="role">{{ role() }}</h2>
      <p class="bio">{{ bio() }}</p>
    </div>

    <!-- Links de Ação (CTA) -->
    <div class="hero-actions">
      <a href="#contato" class="btn btn-primary">
        <span>Fale Comigo</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>

      <a href="https://github.com/DevJoaoEudes" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" title="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
        </svg>
        <span>GitHub</span>
      </a>

      <a href="https://www.linkedin.com/in/joao-eudes-914699414" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" title="LinkedIn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2zM4 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
        </svg>
        <span>LinkedIn</span>
      </a>
    </div>

  </div>
</section>
