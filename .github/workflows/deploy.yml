name: Deploy no GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar Angular com base-href correto para GitHub Pages
        run: npx ng build --base-href /curriculo-eudes/

      - name: Criar fallback 404.html
        run: cp dist/curriculo-eudes/browser/index.html dist/curriculo-eudes/browser/404.html

      - name: Fazer upload do artefato compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/curriculo-eudes/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
